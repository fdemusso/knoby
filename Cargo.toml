[package]
name = "knoby"
version = "0.1.2"
edition = "2024"
description = "Makes a keyboard volume knob control an Elgato Wave Link channel"
license = "MIT"
rust-version = "1.88"

[dependencies]
base64 = "0.23.1"
png = "0.18.1"
serde_json = "1.0.154"
tungstenite = "0.30.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
